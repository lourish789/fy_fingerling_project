services:
  - type: web
    name: aquacount-backend
    runtime: python
    plan: free
    region: oregon

    # Install production-only dependencies (no PyTorch)
    buildCommand: pip install -r requirements-prod.txt

    # gthread worker: built-in to gunicorn, no extras needed.
    # Flask-SocketIO uses async_mode='threading' which pairs with gthread.
    # --workers 1 --threads 4  stays within Render free-tier 512 MB RAM.
    startCommand: >
      gunicorn
      --worker-class gthread
      --workers 1
      --threads 4
      --bind 0.0.0.0:$PORT
      --timeout 120
      --keep-alive 5
      --log-level info
      "src.streaming.wsgi:app"

    healthCheckPath: /api/status

    envVars:
      - key: MODEL_PATH
        value: models/best.onnx
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: PORT
        value: "10000"
      # Set RENDER_BACKEND_URL to your Render public URL so the frontend
      # knows where to connect (used as ?backend= query param):
      - key: RENDER_BACKEND_URL
        value: https://aquacount-backend.onrender.com
